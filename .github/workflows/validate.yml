name: Validate native plugin

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.13']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Parse plugin manifests
        run: |
          python -m json.tool .claude-plugin/plugin.json > /dev/null
          python -m json.tool .claude-plugin/marketplace.json > /dev/null
          python -m json.tool .codex-plugin/plugin.json > /dev/null
          python -m json.tool .agents/plugins/marketplace.json > /dev/null
          python -m json.tool package.json > /dev/null
      - name: Check plugin structure
        run: python scripts/check_plugin.py
      - name: Run offline artifact tests
        run: python -m unittest discover -s tests -p 'test_*.py' -v

  pi-transport:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'
      - name: Install Pi for offline extension checks
        run: npm install --prefix "$RUNNER_TEMP/pi-host" --no-audit --no-fund @earendil-works/pi-coding-agent@1.0.0
      - name: Load extension and check native Agent transport
        run: python scripts/check_runtime_loaders.py --pi-package "$RUNNER_TEMP/pi-host/node_modules/@earendil-works/pi-coding-agent" --transport
